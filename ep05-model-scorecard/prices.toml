# prices.toml - paid-tier prices, used ONLY to estimate what a model would cost at scale.
#
# On the free tier these Gemini models cost nothing. But the free tier has rate limits,
# and Google may use what you send to improve its products (see model_cards.json).
# Prices change often: every entry says where it came from and when it was checked.
#
# Units: US dollars per 1 million tokens. Output tokens include the model's thinking tokens.

[models."gemini-3.5-flash-lite"]
input_per_million = 0.30
output_per_million = 2.50
source = "https://ai.google.dev/gemini-api/docs/pricing"
checked = 2026-10-23

[models."gemini-3.8-flash"]
input_per_million = 0.75
output_per_million = 3.75
source = "https://ai.google.dev/gemini-api/docs/pricing"
checked = 2026-10-23
valid_until = 2026-12-31
note = "From 2027-01-01 the same page lists $1.50 input and $7.50 output."

[models."qwen3.5:4b"]
input_per_million = 0.0
output_per_million = 0.0
source = "https://ollama.com/library/qwen3.5"
checked = 2026-10-23
note = "Runs on your own computer: no price per token (your laptop and electricity are not counted)."
