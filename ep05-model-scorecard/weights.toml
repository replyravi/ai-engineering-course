# weights.toml - what matters for YOUR project. Change the numbers and run scorecard.py again.
#
# Step 1, the must-haves: a model that fails one of them is dropped before any scoring.
# Step 2, the weights: how much quality, speed and cost count. Any positive numbers work;
#         scorecard.py turns them into percentages that add up to 100.

use = "quality_first"   # which profile below scorecard.py uses by default

[must_have]
tier = "free"              # the tier you will use: "free" or "paid"
private_data = false       # true = drop models whose provider may use your prompts on that tier
business_use = true        # true = drop models whose licence is for research only
needs_tools = false        # true = drop models without tool calling
min_quality = 0.5          # at least half of the scored answers must pass
max_median_ms = 10000      # slower than 10 seconds per answer is too slow for a chat helper
max_cost_per_1000 = 5.00   # US dollars per 1,000 questions on the paid tier

[profiles.quality_first]   # a help desk where wrong answers are expensive
quality = 6
speed = 2
cost = 2

[profiles.cost_first]      # a high-volume, low-risk job, like tagging thousands of messages
quality = 2
speed = 2
cost = 6

[profiles.speed_first]     # a live chat box where people wait for every reply
quality = 2
speed = 6
cost = 2
