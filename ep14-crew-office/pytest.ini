[pytest]
# Lets tests do "from outreach_crew import ..." and "from testing.fakes import ...".
pythonpath = .
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    # CrewAI warns that task callbacks "prevent checkpointing"; we never use checkpointing.
    ignore:.*callbacks cannot be serialized.*:UserWarning
